<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>音匣 · Navidrome</title>
<link rel="stylesheet" href="../shared.css"/>
</head>
<body>
<div class="docbar"><a href="../index.html">页面目录</a><b>Navidrome</b></div>
<div class="stage">
<div class="phone">
<div class="status"><span>9:41</span><span class="battery" aria-hidden="true"></span></div>
<div class="screen">
  <div class="navrow">
    <button class="icon-btn" data-back="library.html" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="center-title">Navidrome</div>
    <div class="spacer"></div>
    <button class="icon-btn" data-toast="资料库" aria-label="资料库"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 16.2V8.2l6.5-1.1v7.2"/><circle cx="7.4" cy="16.2" r="1.5" fill="currentColor" stroke="none"/></svg></button>
    <a class="icon-btn" href="connect.html" aria-label="添加资料库"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></a>
  </div>

  <div class="group-head">
    <span>Navidrome 0.58.5 (131c0c56)</span>
    <button type="button" data-toast="已刷新">刷新</button>
  </div>
  <div class="group">
    <div class="row"><span class="name">歌曲</span><span class="spacer" style="flex:1"></span><span class="value">1706</span></div>
    <div class="row"><span class="name">专辑</span><span class="spacer" style="flex:1"></span><span class="value">350</span></div>
    <div class="row"><span class="name">歌手</span><span class="spacer" style="flex:1"></span><span class="value">180</span></div>
    <div class="row"><span class="name">歌单</span><span class="spacer" style="flex:1"></span><span class="value">0</span></div>
  </div>

  <p class="section-label">用户设置</p>
  <div class="group">
    <div class="row"><span class="name">用户名</span><span class="spacer" style="flex:1"></span><span class="value">fuchenlin</span></div>
    <button class="row" type="button" data-toast="修改密码"><span class="name">密码</span><span class="spacer" style="flex:1"></span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
  </div>

  <p class="section-label">资料库管理</p>
  <div class="group">
    <div class="row">
      <span class="name">直连模式</span>
      <span class="spacer" style="flex:1"></span>
      <button class="switch" type="button" id="direct" aria-pressed="true" aria-label="直连模式"></button>
    </div>
    <button class="row" type="button" data-toast="设置别名"><span class="name">别名</span><span class="spacer" style="flex:1"></span><span class="value">未设置</span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
    <button class="row" type="button" data-toast="连接线路"><span class="name">连接线路</span><span class="spacer" style="flex:1"></span><span class="value url">http://nas.clfuai.com:4533/</span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
    <button class="row" type="button" data-confirm="确定删除资料库？" data-toast="资料库已删除" data-clear-library data-go="connect.html"><span class="name danger">删除资料库</span></button>
  </div>
</div>
<a class="mini" href="player-playing.html">
  <span class="cover" style="border-radius:50%"></span>
  <span class="grow"><b>午夜回声</b><span>Luna Waves</span></span>
  <span class="ctrls"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
</a>
<div class="home"><span></span></div>
</div>
</div>
<script src="../shared.js"></script>
<script>
document.getElementById("direct").addEventListener("click", function () {
  var on = this.getAttribute("aria-pressed") !== "true";
  this.setAttribute("aria-pressed", on ? "true" : "false");
  this.classList.toggle("off", !on);
  if (window.yxToast) yxToast(on ? "已开启直连模式" : "已关闭直连模式");
});
</script>
</body>
</html>
