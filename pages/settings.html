<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>音匣 · 设置</title>
<link rel="stylesheet" href="../shared.css"/>
<style>
  .server-card{
    display:flex;align-items:center;gap:12px;
    margin:8px 16px 4px;padding:14px;
    border-radius:14px;background:var(--card,#1c2236);
    text-decoration:none;color:inherit;
  }
  .server-card .dot{width:10px;height:10px;border-radius:50%;background:#3dd68c;flex-shrink:0}
  .server-card .meta{flex:1;min-width:0}
  .server-card .meta b{display:block;font-size:16px;font-weight:600}
  .server-card .meta span{display:block;font-size:12px;color:#8b90a0;margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .server-actions{display:flex;gap:8px;padding:0 16px 8px}
  .server-actions button{
    flex:1;height:36px;border-radius:10px;border:0;
    background:#2a3148;color:#e8eaf0;font-size:14px;cursor:pointer;
  }
  .server-actions button.warn{background:#3a2430;color:#ff8b9a}
  .foot-note{margin:6px 20px 0;text-align:left;opacity:.7;font-size:12px;color:#8b90a0}
</style>
</head>
<body>
<div class="docbar"><a href="../index.html">页面目录</a><b>设置 · 可审稿</b></div>
<div class="stage">
<div class="phone">
<div class="status"><span>9:41</span><span class="battery" aria-hidden="true"></span></div>
<div class="screen pad-tabs">

<h1 class="page-title">设置</h1>

<!-- 1. 服务器（CR-003 / 产品五块已锁） -->
<p class="section-label" style="margin-top:0">服务器</p>
<a class="server-card" href="server.html">
  <span class="dot" aria-hidden="true"></span>
  <span class="meta">
    <b>Navidrome · 已连接</b>
    <span>nas.clfuai.com:4533</span>
  </span>
  <span class="chev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
</a>
<div class="server-actions">
  <button type="button" data-toast="已请求重连（通断细则跟 A/B/C）">重连</button>
  <button type="button" class="warn" data-confirm="断开当前服务器？" data-toast="已断开（示意）">断开</button>
</div>

<!-- 2. 播放：仅循环；无独立音量行 -->
<p class="section-label">播放</p>
<div class="list">
  <button class="row" type="button" id="loopMode" style="width:100%">
    <span class="grow" style="text-align:left"><span class="name">循环模式</span></span>
    <span class="value" id="loopValue">列表循环</span>
  </button>
</div>
<p class="foot-note">音量跟随系统，不单独设项</p>

<!-- 3. 缓存 -->
<p class="section-label">缓存</p>
<div class="list">
  <div class="row"><span class="grow"><span class="name">已用空间</span></span><span class="value">128 MB</span></div>
  <button class="row" type="button" data-confirm="清除播放缓存？不会删除曲库。" data-toast="缓存已清除" style="width:100%">
    <span class="grow" style="text-align:left"><span class="name danger">清除缓存</span></span>
    <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
  </button>
</div>
<p class="foot-note">提示级清理，非整库离线包</p>

<!-- 4. 外观：MVP 仅跟随系统 -->
<p class="section-label">外观</p>
<div class="list">
  <div class="row"><span class="grow"><span class="name">外观</span></span><span class="value">跟随系统</span></div>
</div>

<!-- 5. 关于 -->
<p class="section-label">关于</p>
<a class="row" href="about.html">
  <span class="grow"><span class="name">关于音匣</span></span>
  <span class="value">v1.0.0 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
</a>

</div>
<a class="mini" href="player-playing.html">
  <span class="cover"></span>
  <span class="grow"><b>午夜回声</b><span>Luna Waves</span></span>
  <span class="ctrls"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 6l11 6L4 18z"/></svg></span>
</a>
<nav class="tabs"><a href="search.html">搜索</a><a href="library.html">曲库</a><a href="settings.html" class="on">设置</a></nav>
<div class="home"><span></span></div>
</div>
</div>
<script src="../shared.js"></script>
<script>
(function () {
  var modes = ["列表循环", "单曲循环"];
  var i = 0;
  var btn = document.getElementById("loopMode");
  var val = document.getElementById("loopValue");
  if (btn && val) {
    btn.addEventListener("click", function () {
      i = (i + 1) % modes.length;
      val.textContent = modes[i];
      if (window.yxToast) yxToast(modes[i]);
    });
  }
})();
</script>
</body>
</html>
