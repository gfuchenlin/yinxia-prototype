<script src="../shared.js"></script>
<script>
(function () {
  var KEY = "yinxia-search-history";
  var input = document.getElementById("searchInput");
  var cancel = document.getElementById("searchCancel");
  var history = document.getElementById("history");
  var list = document.getElementById("historyList");
  var clearBtn = document.getElementById("clearHistory");
  var browse = document.getElementById("browse");
  if (!input || !history || !browse) return;

  function read() {
    try { return JSON.parse(sessionStorage.getItem(KEY) || "[]"); }
    catch (err) { return []; }
  }
  function write(items) {
    try { sessionStorage.setItem(KEY, JSON.stringify(items)); } catch (err) {}
  }
  if (!read().length) write(["周杰伦", "小半", "陈粒"]);

  function renderHistory() {
    var items = read();
    list.innerHTML = "";
    clearBtn.hidden = items.length === 0;
    if (!items.length) {
      var empty = document.createElement("p");
      empty.className = "history-empty";
      empty.textContent = "暂无搜索记录";
      list.appendChild(empty);
      return;
    }
    items.forEach(function (text) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "history-item";
      btn.textContent = text;
      btn.addEventListener("click", function () {
        input.value = text;
        applyQuery(text);
        input.focus();
      });
      list.appendChild(btn);
    });
  }

  function remember(text) {
    var q = text.trim();
    if (!q) return;
    var items = read().filter(function (item) { return item !== q; });
    items.unshift(q);
    write(items.slice(0, 12));
    renderHistory();
  }

  function applyQuery(raw) {
    var q = raw.trim().toLowerCase();
    var active = document.activeElement === input;
    browse.querySelectorAll("[data-key]").forEach(function (row) {
      var key = (row.getAttribute("data-key") || "").toLowerCase();
      row.hidden = Boolean(q) && key.indexOf(q) === -1;
    });
    if (q) {
      history.hidden = true;
      browse.hidden = false;
      cancel.hidden = false;
      return;
    }
    history.hidden = !active;
    browse.hidden = active;
    cancel.hidden = !active;
  }

  input.addEventListener("focus", function () { applyQuery(input.value); });
  input.addEventListener("input", function () { applyQuery(input.value); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      remember(input.value);
      applyQuery(input.value);
    }
  });
  cancel.addEventListener("click", function () {
    input.value = "";
    input.blur();
    history.hidden = true;
    browse.hidden = false;
    cancel.hidden = true;
    browse.querySelectorAll("[data-key]").forEach(function (row) { row.hidden = false; });
  });
  clearBtn.addEventListener("click", function () {
    write([]);
    renderHistory();
  });

  renderHistory();
})();
</script>
