<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>音匣 · 连接配置</title>
<link rel="stylesheet" href="../shared.css"/>
</head>
<body>
<div class="docbar"><a href="../index.html">页面目录</a><b>连接配置</b></div>
<div class="stage">
<div class="phone ">
<div class="status"><span>9:41</span><span class="battery" aria-hidden="true"></span></div>
<div class="screen">
  <div class="navrow">
  <button class="icon-btn" data-back="connect.html" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></button>
  <div class="center-title"></div>
  <div class="spacer"></div>
  <span style="width:36px"></span>
</div>
  <h1 class="page-title" style="font-size:28px">连接 <span data-service>Navidrome</span></h1>
  <div class="badge"><i></i><span data-service>Navidrome</span></div>
  <p class="section-label">填写服务器信息</p>
  <form data-connect-form>
    <div class="field"><label>服务器地址</label><input name="host" placeholder="https://music.example.com" value="https://music.example.com"/></div>
    <div class="field"><label>用户名</label><input name="user" placeholder="yourname" value="demo"/></div>
    <div class="field"><label>密码</label><input name="pass" type="password" value="password"/></div>
    <p class="hint">地址需含协议，如 https://</p>
    <button class="btn" type="submit">连接</button>
  </form>
  <a class="btn ghost" href="connect.html">改用其他服务</a>
</div>
<div class="home"><span></span></div>
</div>
</div>
<script src="../shared.js"></script>
</body>
</html>
